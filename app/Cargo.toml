[package]
name = "devutils"
description = "A native macOS collection of small developer tools"
version = "0.6.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
winit = "0.30"
regex = "1.13.1"
sha1 = "0.11.0"
sha2 = "0.11.1"
md-5 = "0.11.0"
url = "2.5.8"
arboard = { version = "3", default-features = false, features = ["image-data"] }
sqlformat = "0.5"
minify-html = "0.18"
quick-xml = "0.42"
oxc = { version = "0.158", features = ["codegen", "minifier"] }
croner = "4"
chrono = "0.4"
x509-parser = "0.18"
rqrr = { version = "0.11", default-features = false }
qrcode = { version = "0.14", default-features = false }
similar = "3.2.1"
html-escape = "0.3.1"
getrandom = "0.3"
egui-phosphor = "0.9"
egui_extras = { version = "0.31", default-features = false, features = ["datepicker", "syntect", "serde"] }
chrono-tz = "0.10"
csscolorparser = "0.9"
hmac = "0.13"
bip39 = { version = "3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
unicode-segmentation = "1"
unicode-normalization = "0.1"
percent-encoding = "2"
unicode_names2 = "4"
rfd = { version = "0.18", default-features = false }
ipnet = "2"
csv = "1"
egui_commonmark = { version = "0.20", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde-saphyr = "2.2"
toml = { version = "1.2", features = ["preserve_order"] }
flate2 = "1"

[profile.release]
# Smallest binary (~24 MB instead of ~35 MB) at the cost of a slower release
# build (~3-4 min): whole-program link-time optimization, one codegen unit,
# no unwinding tables and no debug symbols. Day-to-day `cargo run` is unaffected.
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
