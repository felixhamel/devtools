[package]
name = "devutils"
description = "A native macOS collection of small developer tools"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
urlencoding = "2"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
winit = "0.30"
regex = "1.13.1"
sha1 = "0.11.0"
sha2 = "0.11.1"
md-5 = "0.11.0"
url = "2.5.8"
arboard = { version = "3", default-features = false, features = ["image-data"] }
sqlformat = "0.5"
minify-html = "0.18"
quick-xml = "0.42"
oxc = { version = "0.158", features = ["codegen", "minifier"] }
croner = "4"
chrono = "0.4"
shlex = "2"
x509-parser = "0.18"
rqrr = { version = "0.11", default-features = false }
qrcode = { version = "0.14", default-features = false }
similar = "3.2.1"
html-escape = "0.3.1"
getrandom = "0.3"
egui-phosphor = "0.9"
egui_extras = { version = "0.31", default-features = false, features = ["syntect"] }

[profile.release]
# Smallest binary (~24 MB instead of ~35 MB) at the cost of a slower release
# build (~3-4 min): whole-program link-time optimization, one codegen unit,
# no unwinding tables and no debug symbols. Day-to-day `cargo run` is unaffected.
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
